[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-performance-report-kit"
version = "0.1.0"
description = "Trade CSV to client-ready trading performance reports with metrics, charts, and PDF output."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Emir Huseyin Inci" }]
dependencies = [
    "joblib>=1.3",
    "kaggle>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26,<3.0",
    "pandas>=2.1",
    "pandera>=0.19",
    "pydantic>=2.6",
    "reportlab>=4.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
trading-report = "trading_report_kit.cli:app"
trading-prepare-kaggle = "trading_report_kit.kaggle_data:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp --cov=trading_report_kit --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.coverage.run]
omit = [
    "src/trading_report_kit/__main__.py",
]
